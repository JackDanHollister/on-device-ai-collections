name: Check code
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[test]"
      - name: Verify preserved source
        run: python analysis/verify_archive.py
      - name: Run offline experiment and workflow tests
        run: python -m pytest -q --basetemp /dev/shm/on-device-ai-collections-tests
      - name: Check Python syntax
        run: python -m compileall -q src scripts
      - name: Check offline demonstration
        run: collections-ai demo --output runs/ci-demo
